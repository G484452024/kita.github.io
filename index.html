<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="情報工学科3年のHALのプロフィールサイト。趣味やプログラミング経験、授業で学びたいことを紹介します。">
  <title>HAL | ポートフォリオ</title>

  <style>
    /* 全体で使う色をまとめて管理 */
    :root {
      --background: #f4fbfc;
      --surface: #ffffff;
      --cyan-light: #e0f7fa;
      --cyan: #53cbd6;
      --accent: #127783;
      --text: #29464b;
      --muted: #5b7378;
      --border: #d9ecee;
      --radius: 24px;
    }

    /* 余白や枠線を要素のサイズに含める */
    * {
      box-sizing: border-box;
    }

    /* 基本の文字と背景を設定 */
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    a {
      color: inherit;
    }

    /* キーボード操作時に選択しているリンクを分かりやすく表示 */
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    /* ページの横幅を制限し、左右に余白を確保 */
    .container {
      width: min(100% - 40px, 960px);
      margin-inline: auto;
    }

    /* サイト名とページ内リンクを横に並べる */
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding-block: 26px;
    }

    .site-name {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    /* 画像を使わず、CSSでシアンの丸を描く */
    .site-name::before {
      content: "";
      width: 12px;
      height: 12px;
      background: var(--cyan);
      border-radius: 50%;
    }

    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav a {
      display: inline-block;
      padding-block: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
    }

    nav a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    /* メインの紹介エリア。淡いグラデーションでやわらかさを表現 */
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 64px 52px;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: linear-gradient(125deg, #ffffff 15%, #e0f7fa 100%);
    }

    /* 背景の装飾用の円。文字より後ろに配置 */
    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -65px;
      bottom: -110px;
      width: 320px;
      height: 320px;
      border: 45px solid rgb(83 203 214 / 12%);
      border-radius: 50%;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 10vw, 5.5rem);
      line-height: 1.15;
      letter-spacing: 0.04em;
    }

    .affiliation {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .catchcopy {
      max-width: 560px;
      margin: 26px 0 0;
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      font-weight: 500;
      line-height: 1.8;
    }

    /* 各セクションの見出しと余白 */
    section {
      scroll-margin-top: 24px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 44px 0 20px;
      font-size: 1.25rem;
    }

    .section-heading::before {
      content: "";
      flex-shrink: 0;
      width: 6px;
      height: 22px;
      border-radius: 6px;
      background: var(--cyan);
    }

    /* プロフィールを白いカードにまとめる */
    .card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 8px 28px rgb(41 70 75 / 3%);
    }

    .profile-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      margin: 0;
    }

    .profile-list dt {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .profile-list dd {
      margin: 6px 0 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* 趣味とプログラミング経験は2列で配置 */
    .two-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 22px;
    }

    .card h3 {
      margin: 0 0 18px;
      font-size: 1rem;
      font-weight: 600;
    }

    /* 趣味や使用言語を丸みのあるラベルで表示 */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tags li {
      padding: 6px 18px;
      border-radius: 999px;
      background: var(--cyan-light);
      color: var(--accent);
      font-size: 0.95rem;
    }

    /* 学びたいことを読みやすく表示 */
    .learning-card p {
      margin: 0;
      font-size: 1.05rem;
    }

    /* 最後のひとことは淡いシアンの背景で強調 */
    .message {
      margin-top: 36px;
      padding: 32px;
      border-radius: var(--radius);
      background: var(--cyan-light);
    }

    .message h2 {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 1rem;
    }

    .message p {
      margin: 0;
    }

    /* フッターは控えめな色で中央に配置 */
    footer {
      padding: 36px 20px;
      color: var(--muted);
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* スマートフォンではカードを1列にし、余白を調整 */
    @media (max-width: 600px) {
      .container {
        width: min(100% - 32px, 960px);
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding-block: 20px;
      }

      nav ul {
        gap: 8px 20px;
      }

      .hero {
        padding: 38px 26px;
        border-radius: 26px;
      }

      .profile-list,
      .two-columns {
        grid-template-columns: 1fr;
      }

      .profile-list {
        gap: 16px;
      }

      .profile-list > div {
        display: grid;
        grid-template-columns: 5em 1fr;
        align-items: baseline;
        gap: 12px;
      }

      .profile-list dd {
        margin: 0;
      }

      .two-columns {
        gap: 16px;
        margin-top: 16px;
      }

      .card,
      .message {
        padding: 24px;
      }

      .section-heading {
        margin-top: 32px;
      }
    }
  </style>
</head>

<body>
  <!-- ヘッダー：サイト名と各セクションへのリンク -->
  <header id="top">
    <div class="container header-inner">
      <a class="site-name" href="#top" aria-label="HALのページ先頭へ">HAL</a>
      <nav aria-label="ページ内メニュー">
        <ul>
          <li><a href="#about">プロフィール</a></li>
          <li><a href="#learning">学びたいこと</a></li>
          <li><a href="#message">ひとこと</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- メインビジュアル：名前、所属、キャッチコピー -->
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">MY PORTFOLIO</p>
      <h1 id="hero-title">HAL</h1>
      <p class="affiliation">情報工学科 · 3年</p>
      <p class="catchcopy">休みの日は大学の課題や<br>ゲームをしています</p>
    </section>

    <!-- プロフィール：基本情報と好きなこと、プログラミング経験 -->
    <section id="about" aria-labelledby="about-title">
      <h2 class="section-heading" id="about-title">プロフィール</h2>

      <div class="card">
        <dl class="profile-list">
          <div>
            <dt>名前</dt>
            <dd>HAL</dd>
          </div>
          <div>
            <dt>学年</dt>
            <dd>3年</dd>
          </div>
          <div>
            <dt>所属</dt>
            <dd>情報工学科</dd>
          </div>
        </dl>
      </div>

      <div class="two-columns">
        <div class="card">
          <h3>趣味・好きなこと</h3>
          <ul class="tags">
            <li>ゲーム</li>
            <li>雑談</li>
          </ul>
        </div>

        <div class="card">
          <h3>プログラミング経験</h3>
          <ul class="tags">
            <li>Python</li>
            <li>Java</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- この授業で学びたい内容 -->
    <section id="learning" aria-labelledby="learning-title">
      <h2 class="section-heading" id="learning-title">この授業で学びたいこと</h2>
      <div class="card learning-card">
        <p>OSSの使い方と、利用する上での注意点を学びたいです。</p>
      </div>
    </section>

    <!-- 訪問者に向けたひとこと -->
    <section class="message" id="message" aria-labelledby="message-title">
      <h2 id="message-title">ひとこと</h2>
      <p>
        ゲームが好きな情報工学科のHALです。<br>
        Gitを使った開発に慣れていきたいです！
      </p>
    </section>
  </main>

  <!-- ページ下部のサイト表記 -->
  <footer>HAL · PORTFOLIO</footer>
</body>
</html>
